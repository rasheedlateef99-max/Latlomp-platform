<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Platform Administration — LatLomp</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --primary:#6c63ff; --pd:#574fd6; --green:#43e97b; --red:#ff6584;
      --orange:#ffa500;  --dark:#0f0f1a; --dark-2:#1a1a2e;
      --border:rgba(255,255,255,0.08);
      --text:#fff; --muted:#6b6b8a; --secondary:#a0a0c0;
    }
    html, body { margin:0; padding:0; background:var(--dark); color:var(--text);
      font-family:'Inter',sans-serif; overflow-x:hidden; }
    @keyframes spin   { to { transform:rotate(360deg); } }
    @keyframes fadeUp { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }

    /* LOADER */
    #pageLoader { position:fixed; inset:0; background:var(--dark); z-index:9000;
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; }
    .loader-spinner { width:48px; height:48px; border:4px solid rgba(108,99,255,0.2);
      border-top-color:var(--primary); border-radius:50%; animation:spin 0.8s linear infinite; }

    /* SIDEBAR */
    .sidebar { position:fixed; top:0; left:0; bottom:0; width:256px; z-index:400;
      background:var(--dark-2); border-right:1px solid var(--border);
      display:flex; flex-direction:column; overflow-y:auto; overflow-x:hidden;
      transition:transform 0.3s cubic-bezier(0.4,0,0.2,1); }
    @media (max-width:960px) {
      .sidebar { transform:translateX(-100%); }
      .sidebar.open { transform:translateX(0); box-shadow:8px 0 48px rgba(0,0,0,0.6); }
    }
    .sidebar-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:399; }
    .sidebar-overlay.visible { display:block; }

    .sb-header { padding:20px; border-bottom:1px solid var(--border);
      display:flex; align-items:center; gap:10px; flex-shrink:0; }
    .sb-logo-name { font-size:15px; font-weight:800; color:#fff; }
    .sb-logo-badge { background:linear-gradient(135deg,var(--primary),var(--pd));
      color:#fff; font-size:9px; font-weight:700; padding:2px 7px;
      border-radius:20px; text-transform:uppercase; letter-spacing:0.3px; }
    .sb-profile { padding:16px 20px; border-bottom:1px solid var(--border);
      display:flex; align-items:center; gap:12px; flex-shrink:0; }
    .sb-avatar { width:40px; height:40px; border-radius:10px;
      background:linear-gradient(135deg,var(--primary),var(--pd));
      display:flex; align-items:center; justify-content:center;
      font-weight:900; font-size:17px; color:#fff; flex-shrink:0; overflow:hidden; }
    .sb-avatar img { width:100%; height:100%; object-fit:cover; }
    .sb-name     { font-size:14px; font-weight:700; color:#fff; line-height:1.3; }
    .sb-role-lbl { font-size:11px; color:var(--primary); font-weight:700;
      text-transform:uppercase; letter-spacing:0.4px; margin-top:2px; }
    .sb-nav { flex:1; padding:10px; }
    .sb-sep { font-size:10px; font-weight:700; color:var(--muted);
      text-transform:uppercase; letter-spacing:0.6px; padding:14px 10px 6px; }
    .nav-item { display:flex; align-items:center; gap:10px; padding:10px 12px;
      border-radius:10px; font-size:14px; font-weight:500; color:var(--secondary);
      cursor:pointer; transition:all 0.15s; margin-bottom:2px;
      width:100%; border:none; background:none; font-family:inherit;
      text-align:left; text-decoration:none; line-height:1.4; }
    .nav-item:hover { background:rgba(255,255,255,0.06); color:#fff; }
    .nav-item.active { background:rgba(108,99,255,0.15); color:var(--primary); font-weight:700; }
    .nav-icon { font-size:16px; width:22px; text-align:center; flex-shrink:0; }
    .sb-footer { padding:10px; border-top:1px solid var(--border); flex-shrink:0; }

    /* MOBILE BAR */
    .mobile-bar { display:none; align-items:center; justify-content:space-between;
      padding:0 16px; height:60px; background:var(--dark-2);
      border-bottom:1px solid var(--border); position:sticky; top:0; z-index:300; }
    @media (max-width:960px) { .mobile-bar { display:flex !important; } }
    .ham-btn { background:none; border:none; color:#fff; font-size:22px;
      cursor:pointer; padding:8px; border-radius:8px; }

    /* MAIN */
    .main { margin-left:256px; min-height:100vh; display:flex; flex-direction:column; }
    @media (max-width:960px) { .main { margin-left:0 !important; } }
    .page-content { padding:24px 28px; flex:1; }
    @media (max-width:960px) { .page-content { padding:20px 16px; } }
    @media (max-width:600px) { .page-content { padding:14px 12px; } }

    /* SECTIONS */
    .p-section { display:none; animation:fadeUp 0.3s ease; }
    .p-section.active { display:block; }

    /* PAGE HEADER */
    .page-header { display:flex; align-items:flex-start; justify-content:space-between;
      margin-bottom:24px; gap:12px; flex-wrap:wrap; }
    .page-header h1 { font-size:22px; font-weight:800; color:#fff; margin:0 0 4px; }
    .page-header p  { font-size:13px; color:var(--muted); margin:0; }

    /* STATS */
    .stats-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:14px; margin-bottom:24px; }
    @media (max-width:1100px) { .stats-grid { grid-template-columns:repeat(3,1fr); } }
    @media (max-width:700px)  { .stats-grid { grid-template-columns:1fr 1fr; gap:10px; } }
    .stat-card { background:var(--dark-2); border:1px solid var(--border);
      border-radius:14px; padding:18px; display:flex; align-items:center; gap:14px; }
    .stat-icon { width:42px; height:42px; border-radius:10px;
      display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
    .stat-val  { font-size:26px; font-weight:900; color:#fff; line-height:1; }
    .stat-lbl  { font-size:11px; font-weight:700; color:var(--muted);
      text-transform:uppercase; letter-spacing:0.5px; margin-top:3px; }

    /* CARD */
    .card { background:var(--dark-2); border:1px solid var(--border);
      border-radius:16px; overflow:hidden; margin-bottom:20px; }
    .card-head { display:flex; align-items:center; justify-content:space-between;
      padding:16px 20px; border-bottom:1px solid var(--border); flex-wrap:wrap; gap:10px; }
    .card-head h3 { font-size:15px; font-weight:700; color:#fff; margin:0; }
    .card-body { padding:20px; }

    /* TABLE */
    .table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
    table { width:100%; border-collapse:collapse; min-width:500px; }
    th { padding:11px 14px; text-align:left; font-size:11px; font-weight:700;
      text-transform:uppercase; letter-spacing:0.4px; color:var(--muted);
      background:rgba(255,255,255,0.02); border-bottom:1px solid var(--border); white-space:nowrap; }
    td { padding:11px 14px; font-size:13px; color:var(--secondary);
      border-bottom:1px solid var(--border); vertical-align:middle; }
    tr:last-child td { border-bottom:none; }
    tr:hover td { background:rgba(255,255,255,0.02); }

    /* BUTTONS */
    .btn { display:inline-flex; align-items:center; gap:7px; padding:9px 16px;
      border-radius:9px; font-size:13px; font-weight:700; cursor:pointer;
      font-family:inherit; border:none; transition:all 0.2s; text-decoration:none; white-space:nowrap; }
    .btn-primary  { background:linear-gradient(135deg,var(--primary),var(--pd)); color:#fff; }
    .btn-primary:hover { transform:translateY(-1px); box-shadow:0 4px 16px rgba(108,99,255,0.4); }
    .btn-green    { background:linear-gradient(135deg,var(--green),#38f9d7); color:#0f0f1a; }
    .btn-secondary { background:rgba(255,255,255,0.06); border:1px solid var(--border); color:var(--secondary); }
    .btn-secondary:hover { color:#fff; background:rgba(255,255,255,0.1); }
    .btn-danger   { background:rgba(255,101,132,0.1); border:1px solid rgba(255,101,132,0.3); color:var(--red); }
    .btn-sm { padding:6px 12px; font-size:12px; border-radius:7px; }
    .btn:disabled { opacity:0.5; cursor:not-allowed; transform:none !important; }

    /* BADGES */
    .badge { display:inline-block; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:700; }
    .badge-green  { background:rgba(67,233,123,0.12);  color:var(--green); }
    .badge-red    { background:rgba(255,101,132,0.12); color:var(--red); }
    .badge-orange { background:rgba(255,165,0,0.12);   color:var(--orange); }
    .badge-purple { background:rgba(108,99,255,0.12);  color:#a78bfa; }
    .badge-muted  { background:rgba(255,255,255,0.06); color:var(--secondary); }

    /* MODAL */
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.78); z-index:600;
      display:flex; align-items:center; justify-content:center; padding:20px; overflow-y:auto; }
    .modal-box { background:var(--dark-2); border:1px solid var(--border);
      border-radius:20px; padding:28px; width:100%; max-width:520px; max-height:90vh; overflow-y:auto; }
    .modal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
    .modal-header h2 { font-size:18px; font-weight:800; color:#fff; margin:0; }
    .modal-close { width:32px; height:32px; border-radius:8px; background:rgba(255,255,255,0.06);
      border:1px solid var(--border); color:var(--muted); cursor:pointer; font-size:15px;
      display:flex; align-items:center; justify-content:center; font-family:inherit; }
    .modal-close:hover { background:rgba(255,101,132,0.15); color:var(--red); }
    .modal-footer { display:flex; justify-content:flex-end; gap:10px; margin-top:20px;
      padding-top:16px; border-top:1px solid var(--border); flex-wrap:wrap; }

    /* FORM */
    .field { display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
    .field label { font-size:12px; font-weight:700; color:var(--secondary);
      text-transform:uppercase; letter-spacing:0.4px; }
    .field label span { color:var(--red); }
    .inp, .sel, .tex { background:rgba(255,255,255,0.04); border:1px solid var(--border);
      border-radius:9px; padding:11px 13px; color:#fff; font-size:14px;
      font-family:inherit; outline:none; width:100%; transition:border-color 0.2s; }
    .inp:focus, .sel:focus, .tex:focus { border-color:var(--primary); }
    .inp::placeholder, .tex::placeholder { color:var(--muted); }
    .sel option { background:var(--dark-2); }
    .tex { resize:vertical; min-height:80px; }
    .field-hint { font-size:11px; color:var(--muted); margin-top:2px; line-height:1.5; }
    .field-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    @media (max-width:480px) { .field-row { grid-template-columns:1fr; } }

    /* MISC */
    .empty { text-align:center; padding:48px 20px; }
    .empty-icon  { font-size:44px; margin-bottom:12px; }
    .empty-title { font-size:15px; font-weight:700; color:var(--secondary); margin-bottom:6px; }
    .empty-sub   { font-size:13px; color:var(--muted); line-height:1.6; }
    .spinner { width:16px; height:16px; border:2px solid rgba(255,255,255,0.3);
      border-top-color:#fff; border-radius:50%; animation:spin 0.7s linear infinite; display:inline-block; }
    .filter-bar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
    .search-inp { background:rgba(255,255,255,0.04); border:1px solid var(--border);
      border-radius:9px; padding:10px 13px; color:#fff; font-size:13px;
      font-family:inherit; outline:none; flex:1; min-width:180px; }
    .search-inp:focus { border-color:var(--primary); }
    .search-inp::placeholder { color:var(--muted); }
    .perm-chip { padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700;
      background:rgba(108,99,255,0.1); border:1px solid rgba(108,99,255,0.2);
      color:#a78bfa; display:inline-block; margin:2px; }
    .redirect-card { background:rgba(255,255,255,0.02); border:1px dashed var(--border);
      border-radius:16px; padding:48px; text-align:center; }
    .invite-url-box { background:rgba(67,233,123,0.06); border:1px solid rgba(67,233,123,0.2);
      border-radius:10px; padding:14px 16px; margin:12px 0; }
    .info-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .info-box { background:rgba(255,255,255,0.03); border-radius:10px; padding:14px; }
    .info-box-label { font-size:11px; color:var(--muted); text-transform:uppercase;
      letter-spacing:0.4px; margin-bottom:4px; }
    .info-box-value { font-weight:700; color:#fff; font-size:13px; }

    #platformToast { position:fixed; bottom:24px; right:24px; z-index:9999;
      background:var(--dark-2); border-radius:12px; padding:14px 20px;
      font-size:14px; font-weight:600; font-family:'Inter',sans-serif;
      box-shadow:0 8px 32px rgba(0,0,0,0.5); max-width:340px;
      display:none; align-items:center; gap:10px; border:1px solid var(--border); }
    @media (max-width:600px) {
      .modal-overlay { align-items:flex-end; padding:0; }
      .modal-box { border-radius:20px 20px 0 0; max-width:100%; max-height:90vh; }
    }
  </style>
</head>
<body>

<!-- PAGE LOADER -->
<div id="pageLoader">
  <div class="loader-spinner"></div>
  <p style="color:var(--muted); font-size:14px; margin:0;">Loading Platform Administration...</p>
</div>

<div id="platformApp" style="display:none;">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-header">
      <span style="font-size:24px;">⚡</span>
      <div>
        <div class="sb-logo-name">LatLomp</div>
        <div class="sb-logo-badge">Platform Admin</div>
      </div>
    </div>
    <div class="sb-profile">
      <div class="sb-avatar" id="sbAvatar">A</div>
      <div>
        <div class="sb-name" id="sbName">Loading...</div>
        <div class="sb-role-lbl" id="sbRoleLabel">—</div>
      </div>
    </div>
    <!-- Nav generated dynamically by buildDashboard() -->
    <nav class="sb-nav" id="sbNavItems"></nav>
    <div class="sb-footer">
      <button class="nav-item" style="color:var(--red);" onclick="platformLogout()">
        <span class="nav-icon">🚪</span> Logout
      </button>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <div class="mobile-bar">
      <button class="ham-btn" onclick="openSidebar()">&#9776;</button>
      <span style="font-size:15px; font-weight:800;">⚡ Platform Admin</span>
      <span style="font-size:12px; color:var(--muted);" id="mobileSec">Overview</span>
    </div>
    <!-- Sections generated dynamically -->
    <div class="page-content" id="pageContent"></div>
  </div>
</div>

<!-- INVITE MODAL -->
<div class="modal-overlay" id="inviteModal" style="display:none;">
  <div class="modal-box">
    <div class="modal-header">
      <h2>Invite Platform Staff</h2>
      <button class="modal-close" onclick="closeModal('inviteModal')">✕</button>
    </div>
    <div id="inviteErrBox"
      style="display:none; background:rgba(255,101,132,0.1); border:1px solid rgba(255,101,132,0.3);
             color:var(--red); padding:12px; border-radius:8px; font-size:13px; margin-bottom:16px;"></div>
    <div class="field">
      <label>Email Address <span>*</span></label>
      <input type="email" id="invEmail" class="inp" placeholder="staff@gmail.com" />
      <div class="field-hint">Must be a Gmail account — staff sign in with Google.</div>
    </div>
    <div class="field">
      <label>Name (optional)</label>
      <input type="text" id="invName" class="inp" placeholder="e.g. Amina Johnson" />
    </div>
    <div class="field">
      <label>Platform Role <span>*</span></label>
      <select id="invRole" class="sel" onchange="updateRoleDescription()">
        <option value="support_admin">Support Administrator</option>
        <option value="finance_admin">Finance Administrator</option>
        <option value="content_admin">Content Administrator</option>
        <option value="developer">Developer (Read-only)</option>
        <option value="platform_admin">Platform Administrator</option>
      </select>
      <div class="field-hint" id="roleHint" style="color:var(--secondary); line-height:1.6;"></div>
    </div>
    <div id="inviteResultWrap" style="display:none;">
      <div class="invite-url-box">
        <div style="font-size:11px; font-weight:700; color:var(--green); text-transform:uppercase; margin-bottom:6px;">✅ Invitation Created — Share this link:</div>
        <div style="font-size:12px; color:#fff; word-break:break-all; font-family:monospace; line-height:1.6;" id="generatedInviteUrl"></div>
      </div>
      <button class="btn btn-green" style="width:100%; margin-top:8px;" onclick="copyInviteUrl()">📋 Copy Invitation Link</button>
      <div style="font-size:12px; color:var(--muted); text-align:center; margin-top:10px;">
        Share via WhatsApp, Telegram, email, or any channel. Link expires in 7 days.
      </div>
    </div>
    <div class="modal-footer" id="inviteModalFooter">
      <button class="btn btn-secondary" onclick="closeModal('inviteModal')">Cancel</button>
      <button class="btn btn-primary" id="sendInviteBtn" onclick="sendInvite()">Create Invitation</button>
    </div>
  </div>
</div>

<div id="platformToast" style="display:none;"></div>

<script>
/* ============================================
   PLATFORM STAFF DASHBOARD — COMPLETE REBUILD
   All 4 issues fixed:
   Issue 1: Permission names now generate real nav/sections
   Issue 2: Nav built dynamically from DB permissions
   Issue 3: Modules open correct functional pages
   Issue 4: Correct module keys used throughout (no old keys)
============================================ */

var PLATFORM_TOKEN_KEY = 'latlomp_platform_token';
var PLATFORM_STAFF_KEY = 'latlomp_platform_staff';

var _platformStaff = null;
var _platformPerms = [];  /* Loaded fresh from DB on every page load */
var _schoolPage    = 1;
var _schoolTimer   = null;
var _generatedUrl  = '';

/* ============================================
   MODULE CONFIGURATION — SINGLE SOURCE OF TRUTH
   key:    Matches EXACTLY what is stored in DB
           (from PlatformStaff.model.js PLATFORM_MODULES)
   native: true  = has its own data section in this dashboard
   native: false = redirects to Root Admin Panel section
============================================ */
var MODULE_CONFIG = [
  {
    key: 'institutions',  label: 'Institutions',     icon: '🏫',
    desc: 'View all registered schools and their status',
    native: true
  },
  {
    key: 'subscriptions', label: 'Subscriptions',    icon: '💳',
    desc: 'View subscription plans and payment data',
    native: true
  },
  {
    key: 'staff',         label: 'Platform Staff',   icon: '👥',
    desc: 'Invite and view platform administration team',
    native: true
  },
  {
    key: 'analytics',     label: 'Analytics',        icon: '📊',
    desc: 'Platform-wide analytics overview',
    native: true
  },
  {
    key: 'announcements', label: 'Announcements',    icon: '📢',
    desc: 'Send announcements to all registered institutions',
    native: true
  },
  {
    key: 'cbt',           label: 'CBT Management',   icon: '📝',
    desc: 'Manage CBT departments, subjects and questions',
    native: false, adminSection: 'cbt-management'
  },
  {
    key: 'practice',      label: 'Practice Content', icon: '⚡',
    desc: 'Manage practice questions and content',
    native: false, adminSection: null
  },
  {
    key: 'store',         label: 'Store & Products', icon: '🛒',
    desc: 'Manage store products and orders',
    native: false, adminSection: 'products'
  },
  {
    key: 'reports',       label: 'Reports',          icon: '📈',
    desc: 'View and export platform reports',
    native: false, adminSection: null
  },
  {
    key: 'audit_logs',    label: 'Audit Logs',       icon: '🔍',
    desc: 'View system audit and activity logs',
    native: false, adminSection: null
  },
  {
    key: 'content',       label: 'Content',          icon: '📄',
    desc: 'Manage platform content',
    native: false, adminSection: null
  }
];

var ROLE_LABELS = {
  platform_admin: 'Platform Administrator',
  support_admin:  'Support Administrator',
  finance_admin:  'Finance Administrator',
  content_admin:  'Content Administrator',
  developer:      'Developer'
};

var ROLE_DESCRIPTIONS = {
  platform_admin: 'Full platform access. Can invite and view staff.',
  support_admin:  'View schools, analytics, send announcements, view logs.',
  finance_admin:  'View and manage subscriptions, plans, and payment records.',
  content_admin:  'Send announcements to all institutions.',
  developer:      'Read-only access to analytics, audit logs, and reports.'
};

/* ============================================ API WRAPPER */
function platformGetToken() {
  return localStorage.getItem(PLATFORM_TOKEN_KEY);
}

async function platformApi(endpoint, method, body) {
  method = method || 'GET';
  var token   = platformGetToken();
  var headers = { 'Content-Type': 'application/json' };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  var opts = { method: method, headers: headers };
  if (body && method !== 'GET') opts.body = JSON.stringify(body);
  try {
    var res  = await fetch('/api/platform-staff' + endpoint, opts);
    var data = await res.json();
    if (res.status === 401) {
      localStorage.removeItem(PLATFORM_TOKEN_KEY);
      localStorage.removeItem(PLATFORM_STAFF_KEY);
      window.location.href = '/admin.html';
      return { ok: false, status: 401, data: data };
    }
    return { ok: res.ok, status: res.status, data: data };
  } catch (err) {
    return { ok: false, status: 0, data: { message: 'Network error. Please check connection.' } };
  }
}

async function platformAuthApi(endpoint) {
  var token   = platformGetToken();
  var headers = { 'Content-Type': 'application/json' };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  try {
    var res  = await fetch('/api/platform-auth' + endpoint, { method: 'GET', headers: headers });
    var data = await res.json();
    return { ok: res.ok, status: res.status, data: data };
  } catch (err) {
    return { ok: false, status: 0, data: { message: 'Network error.' } };
  }
}

/* ✅ CORRECT: uses MODULE_CONFIG keys (matches DB exactly) */
function hasPermission(key) {
  return _platformPerms.indexOf(key) !== -1;
}

/* ============================================ INIT */
document.addEventListener('DOMContentLoaded', async function () {
  var token = platformGetToken();
  if (!token) { window.location.href = '/admin.html'; return; }

  /* ✅ Always fetch fresh from DB — never use stale localStorage permissions */
  var res = await platformAuthApi('/me');
  if (!res.ok) {
    localStorage.removeItem(PLATFORM_TOKEN_KEY);
    localStorage.removeItem(PLATFORM_STAFF_KEY);
    window.location.href = '/admin.html';
    return;
  }

  _platformStaff = res.data.staff;

  /* ✅ Permissions from DB response (Issue 4 fix) */
  if (_platformStaff.permissions && _platformStaff.permissions.length > 0) {
    _platformPerms = _platformStaff.permissions;
  } else {
    /* Legacy fallback — staff created before dynamic permissions */
    _platformPerms = getDefaultPermissionsForRole(_platformStaff.platformRole);
  }

  /* Store fresh data */
  localStorage.setItem(PLATFORM_STAFF_KEY, JSON.stringify(_platformStaff));

  /* Build the entire UI from permissions */
  buildDashboard();

  /* Show default section */
  showSection('overview');

  document.getElementById('pageLoader').style.display  = 'none';
  document.getElementById('platformApp').style.display = 'block';

  /* Load overview data */
  fillOverview();
  if (hasPermission('analytics')) { loadStatsData(); }
});

function getDefaultPermissionsForRole(role) {
  var defaults = {
    platform_admin: ['institutions','subscriptions','cbt','staff','analytics','reports','announcements','audit_logs','store'],
    support_admin:  ['institutions','analytics','announcements','audit_logs'],
    finance_admin:  ['institutions','subscriptions','reports','analytics'],
    content_admin:  ['announcements','content'],
    developer:      ['analytics','audit_logs','reports']
  };
  return defaults[role] || [];
}

/* ============================================
   DASHBOARD BUILDER
   Generates nav + all sections from _platformPerms.
   Called once on init. Everything is permission-driven.
   Issue 1 + Issue 2 fix.
============================================ */
function buildDashboard() {
  buildSidebarNav();
  buildPageSections();
  fillSidebar();
}

function buildSidebarNav() {
  var nav  = document.getElementById('sbNavItems');
  if (!nav) { return; }
  var html = '';

  /* Overview — always shown */
  html += '<div class="sb-sep">Workspace</div>';
  html += makeNavBtn('overview', '📊', 'Overview');

  /* Permitted modules in defined order */
  MODULE_CONFIG.forEach(function (mod) {
    if (hasPermission(mod.key)) {
      html += makeNavBtn(mod.key, mod.icon, mod.label);
    }
  });

  html += '<div class="sb-sep">Account</div>';
  html += makeNavBtn('profile', '👤', 'My Profile');
  html += '<a class="nav-item" href="/admin.html" target="_blank">' +
            '<span class="nav-icon">🔧</span> Root Admin Panel' +
          '</a>';

  nav.innerHTML = html;
}

function makeNavBtn(key, icon, label) {
  return '<button class="nav-item" data-sec="' + key + '" onclick="showSection(\'' + key + '\')">' +
    '<span class="nav-icon">' + icon + '</span> ' + esc(label) +
  '</button>';
}

function buildPageSections() {
  var content = document.getElementById('pageContent');
  if (!content) { return; }
  var html = '';

  /* Overview section */
  html += '<div class="p-section" id="sec-overview">' + buildOverviewSection() + '</div>';

  /* Permitted module sections (Issue 3 fix — each opens correct page) */
  MODULE_CONFIG.forEach(function (mod) {
    if (hasPermission(mod.key)) {
      html += '<div class="p-section" id="sec-' + mod.key + '">' +
        buildModuleSection(mod) +
      '</div>';
    }
  });

  /* Profile section */
  html += '<div class="p-section" id="sec-profile">' + buildProfileSection() + '</div>';

  content.innerHTML = html;
}

/* ---- MODULE SECTION (Issue 3 fix) ---- */
function buildModuleSection(mod) {
  var header =
    '<div class="page-header">' +
      '<div><h1>' + mod.icon + ' ' + mod.label + '</h1><p>' + mod.desc + '</p></div>' +
      '<button class="btn btn-secondary btn-sm" onclick="refreshSection(\'' + mod.key + '\')">↻ Refresh</button>' +
    '</div>';

  if (mod.native) {
    /* ✅ Native section: rendered content placeholder.
       Content is loaded when user visits the section.  */
    return header +
      '<div id="content-' + mod.key + '" class="section-content">' +
        '<div style="text-align:center; padding:48px; color:var(--muted);">' +
          '<span class="spinner"></span>' +
        '</div>' +
      '</div>';
  } else {
    /* ✅ Non-native: clear redirect card to Root Admin Panel */
    var adminLink = mod.adminSection
      ? '<a href="/admin.html" target="_blank" class="btn btn-secondary" style="margin-top:16px;">' +
          '🔧 Open ' + mod.label + ' in Root Admin Panel →' +
        '</a>'
      : '<a href="/admin.html" target="_blank" class="btn btn-secondary" style="margin-top:16px;">' +
          '🔧 Open Root Admin Panel →' +
        '</a>';

    return header +
      '<div class="redirect-card">' +
        '<div style="font-size:52px; margin-bottom:16px;">' + mod.icon + '</div>' +
        '<div style="font-size:18px; font-weight:800; color:#fff; margin-bottom:10px;">' + mod.label + '</div>' +
        '<div style="font-size:14px; color:var(--secondary); line-height:1.8; max-width:480px; margin:0 auto 8px;">' +
          mod.desc + '.' +
        '</div>' +
        '<div style="font-size:13px; color:var(--muted); line-height:1.7; max-width:480px; margin:0 auto;">' +
          'This module is managed through the Root Administration Panel. ' +
          'Click the button below to open it directly.' +
        '</div>' +
        adminLink +
      '</div>';
  }
}

/* ============================================ SECTION NAVIGATION */
function showSection(key) {
  /* Deactivate all */
  document.querySelectorAll('.p-section').forEach(function (s) { s.classList.remove('active'); });
  document.querySelectorAll('.nav-item[data-sec]').forEach(function (n) { n.classList.remove('active'); });

  var sec = document.getElementById('sec-' + key);
  var nav = document.querySelector('.nav-item[data-sec="' + key + '"]');
  if (sec) sec.classList.add('active');
  if (nav) nav.classList.add('active');

  /* Mobile label */
  var mod = MODULE_CONFIG.find(function (m) { return m.key === key; });
  var lbl = mod ? mod.label : (key.charAt(0).toUpperCase() + key.slice(1));
  var ml  = document.getElementById('mobileSec');
  if (ml) ml.textContent = lbl;

  if (window.innerWidth <= 960) { closeSidebar(); }

  /* Load native content on first visit */
  if (mod && mod.native) {
    var container = document.getElementById('content-' + key);
    if (container && container.querySelector('.spinner')) {
      loadNativeSection(key, container);
    }
  }

  /* Profile: fill data */
  if (key === 'profile') { fillProfile(); }
}

function refreshSection(key) {
  var mod = MODULE_CONFIG.find(function (m) { return m.key === key; });
  if (!mod || !mod.native) { return; }
  var container = document.getElementById('content-' + key);
  if (!container) { return; }
  container.innerHTML = '<div style="text-align:center; padding:48px; color:var(--muted);"><span class="spinner"></span></div>';
  loadNativeSection(key, container);
}

/* Route native section to the correct loader */
function loadNativeSection(key, container) {
  switch (key) {
    case 'institutions':  loadInstitutionsSection(container);  break;
    case 'subscriptions': loadSubscriptionsSection(container); break;
    case 'staff':         loadStaffSection(container);         break;
    case 'analytics':     loadAnalyticsSection(container);     break;
    case 'announcements': loadAnnouncementsSection(container); break;
    default: container.innerHTML = '<div class="empty"><div class="empty-icon">🔧</div>' +
             '<div class="empty-title">Section not yet available</div></div>';
  }
}

/* ============================================ SIDEBAR FILL */
function fillSidebar() {
  var s = _platformStaff;
  if (!s) { return; }
  var av = document.getElementById('sbAvatar');
  if (av) {
    if (s.avatar) { av.innerHTML = '<img src="' + esc(s.avatar) + '" alt="Avatar" />'; }
    else           { av.textContent = (s.name || 'A').charAt(0).toUpperCase(); }
  }
  setText('sbName',      s.name || '—');
  setText('sbRoleLabel', ROLE_LABELS[s.platformRole] || s.platformRole);
}

function fillOverview() {
  var s = _platformStaff;
  if (!s) { return; }
  setText('welcomeTitle', 'Welcome, ' + (s.name || 'Administrator') + '!');
  setText('welcomeSub',   (ROLE_LABELS[s.platformRole] || s.platformRole) + ' · LatLomp Platform Administration');
  setText('yourRoleLabel', ROLE_LABELS[s.platformRole] || s.platformRole);
}

function fillProfile() {
  var s = _platformStaff;
  if (!s) { return; }
  var pa = document.getElementById('profileAvatar');
  if (pa) {
    if (s.avatar) { pa.innerHTML = '<img src="' + esc(s.avatar) + '" style="width:72px;height:72px;border-radius:14px;object-fit:cover;" alt="Avatar" />'; }
    else           { pa.textContent = (s.name || 'A').charAt(0).toUpperCase(); }
  }
  setText('profileName',     s.name || '—');
  setText('profileRole',     ROLE_LABELS[s.platformRole] || s.platformRole);
  setText('profileEmail',    s.email || '—');
  setText('profileJoinedAt', s.joinedAt    ? fmtDate(s.joinedAt)    : '—');
  setText('profileLastLogin',s.lastLoginAt ? fmtDate(s.lastLoginAt) : '—');
  setText('profileInvitedBy',s.invitedBy === 'root' ? '👑 Root Super Admin' : (s.invitedBy || '—'));
}

/* ============================================ ANALYTICS — STATS */
async function loadStatsData() {
  var res = await platformApi('/data/stats');
  if (!res.ok) { return; }
  var s = res.data.stats || {};
  setText('stTotal',     s.total      || 0);
  setText('stActive',    s.active     || 0);
  setText('stTrial',     s.trial      || 0);
  setText('stSuspended', s.suspended  || 0);
  setText('stRevenue',   s.totalRevenue ? '₦' + Number(s.totalRevenue).toLocaleString() : '₦0');
}

/* ============================================
   INSTITUTIONS SECTION
   ✅ Correct endpoint: /data/schools
   ✅ Correct permission key: 'institutions'
============================================ */
function loadInstitutionsSection(container) {
  container.innerHTML =
    '<div class="filter-bar">' +
      '<input type="text" class="search-inp" id="schoolSearch" placeholder="Search name or email..." ' +
             'oninput="debounceSchoolSearch()" />' +
      '<select class="sel" id="schoolStatusFilter" onchange="reloadSchools()" ' +
              'style="width:auto; padding:10px 12px;">' +
        '<option value="">All Status</option>' +
        '<option value="active">Active</option>' +
        '<option value="trial">Trial</option>' +
        '<option value="expired">Expired</option>' +
        '<option value="suspended">Suspended</option>' +
      '</select>' +
    '</div>' +
    '<div class="card">' +
      '<div class="card-head"><h3 id="schoolsTableTitle">All Institutions</h3></div>' +
      '<div class="table-wrap"><table>' +
        '<thead><tr>' +
          '<th>Institution</th><th>Email</th><th>Type</th>' +
          '<th>Status</th><th>Plan</th><th>Expiry</th>' +
        '</tr></thead>' +
        '<tbody id="schoolsBody">' +
          '<tr><td colspan="6" style="text-align:center; padding:32px; color:var(--muted);">' +
            '<span class="spinner"></span></td></tr>' +
        '</tbody>' +
      '</table></div>' +
      '<div id="schoolsPagination" style="display:flex; align-items:center; justify-content:center; ' +
           'gap:14px; padding:16px; border-top:1px solid var(--border);"></div>' +
    '</div>';

  loadSchoolsData(1);
}

function debounceSchoolSearch() {
  if (_schoolTimer) clearTimeout(_schoolTimer);
  _schoolTimer = setTimeout(function () { loadSchoolsData(1); }, 400);
}
function reloadSchools() { loadSchoolsData(1); }

async function loadSchoolsData(page) {
  _schoolPage = page || _schoolPage;
  var search  = (document.getElementById('schoolSearch')       || {}).value || '';
  var status  = (document.getElementById('schoolStatusFilter') || {}).value || '';
  var qs      = '?page=' + _schoolPage + '&limit=15';
  if (search) qs += '&search=' + encodeURIComponent(search);
  if (status) qs += '&status=' + status;

  var tbody = document.getElementById('schoolsBody');
  if (tbody) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:32px; color:var(--muted);">' +
                      '<span class="spinner"></span></td></tr>';
  }

  var res = await platformApi('/data/schools' + qs);
  if (!res.ok) {
    if (tbody) tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:var(--red); padding:24px;">' +
      esc(res.data.message || 'Failed to load schools.') + '</td></tr>';
    return;
  }

  var schools = res.data.schools || [];
  var total   = res.data.total   || 0;
  var pages   = res.data.pages   || 1;

  setText('schoolsTableTitle', total + ' institution' + (total !== 1 ? 's' : '') + ' found');

  var statusMap = {
    active:    '<span class="badge badge-green">Active</span>',
    trial:     '<span class="badge badge-purple">Trial</span>',
    expired:   '<span class="badge badge-orange">Expired</span>',
    suspended: '<span class="badge badge-red">Suspended</span>'
  };

  if (!schools.length) {
    if (tbody) tbody.innerHTML =
      '<tr><td colspan="6"><div class="empty">' +
        '<div class="empty-icon">🏫</div>' +
        '<div class="empty-title">No institutions found</div>' +
      '</div></td></tr>';
    return;
  }

  if (tbody) {
    tbody.innerHTML = schools.map(function (s) {
      var expiry = s.subscriptionExpiry
        ? new Date(s.subscriptionExpiry).toLocaleDateString('en-NG', { day:'numeric', month:'short', year:'numeric' })
        : '—';
      var daysLbl = '';
      if (s.daysLeft > 0 && s.status !== 'suspended') {
        var daysColor = s.daysLeft < 7 ? 'var(--orange)' : 'var(--green)';
        daysLbl = ' <span style="font-size:11px; color:' + daysColor + ';">(' + s.daysLeft + 'd)</span>';
      }
      return '<tr>' +
        '<td>' +
          '<div style="font-weight:700; color:#fff;">' + esc(s.name) + '</div>' +
          '<div style="font-size:11px; color:var(--muted); font-family:monospace; margin-top:2px;">' +
            esc(s.slug || '') + '</div>' +
        '</td>' +
        '<td style="font-size:12px;">' + esc(s.email || '—') + '</td>' +
        '<td style="text-transform:capitalize; font-size:12px;">' + esc(s.type || '—') + '</td>' +
        '<td>' + (statusMap[s.status] || '<span class="badge badge-muted">' + esc(s.status) + '</span>') + '</td>' +
        '<td style="font-size:12px; text-transform:uppercase; letter-spacing:0.4px;">' +
          esc(s.subscriptionPlan || '—') + '</td>' +
        '<td style="font-size:12px;">' + expiry + daysLbl + '</td>' +
      '</tr>';
    }).join('');
  }

  /* Pagination */
  var pag = document.getElementById('schoolsPagination');
  if (pag) {
    if (pages > 1) {
      var btns = '';
      for (var p = 1; p <= Math.min(pages, 10); p++) {
        btns += '<button class="btn btn-sm ' + (p === _schoolPage ? 'btn-primary' : 'btn-secondary') +
                '" onclick="loadSchoolsData(' + p + ')">' + p + '</button>';
      }
      pag.innerHTML = btns;
      pag.style.display = 'flex';
    } else {
      pag.style.display = 'none';
    }
  }
}

/* ============================================
   SUBSCRIPTIONS SECTION
   ✅ Correct endpoint: /data/subscriptions
   ✅ Correct permission key: 'subscriptions'
============================================ */
async function loadSubscriptionsSection(container) {
  var res = await platformApi('/data/subscriptions');
  if (!res.ok) {
    container.innerHTML = '<div class="empty"><div class="empty-icon">❌</div>' +
      '<div class="empty-title">Failed to load</div>' +
      '<div class="empty-sub">' + esc(res.data.message || 'Network error.') + '</div></div>';
    return;
  }

  var plans = res.data.plans || [];
  var subs  = res.data.recentSubscriptions || [];
  var stats = res.data.stats || {};
  var activeCount = (stats.active  && stats.active.count)  ? stats.active.count  : 0;
  var totalRev    = (stats.active  && stats.active.total)  ? stats.active.total  : 0;

  container.innerHTML =
    '<div style="display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:20px;">' +
      '<div class="stat-card"><div class="stat-icon" style="background:rgba(108,99,255,0.12);">📋</div>' +
        '<div><div class="stat-val">' + plans.length + '</div><div class="stat-lbl">Plans</div></div></div>' +
      '<div class="stat-card"><div class="stat-icon" style="background:rgba(67,233,123,0.12);">✅</div>' +
        '<div><div class="stat-val">' + activeCount + '</div><div class="stat-lbl">Active Subs</div></div></div>' +
      '<div class="stat-card"><div class="stat-icon" style="background:rgba(67,233,123,0.12);">💰</div>' +
        '<div><div class="stat-val">₦' + Number(totalRev).toLocaleString() + '</div>' +
        '<div class="stat-lbl">Total Revenue</div></div></div>' +
    '</div>' +
    '<div class="card">' +
      '<div class="card-head"><h3>Subscription Plans</h3></div>' +
      '<div class="table-wrap"><table>' +
        '<thead><tr>' +
          '<th>Plan Name</th><th>Code</th><th>Price</th><th>Duration</th><th>Status</th>' +
        '</tr></thead>' +
        '<tbody>' +
        (plans.length ? plans.map(function (p) {
          return '<tr>' +
            '<td style="font-weight:700; color:#fff;">' + esc(p.name) + (p.isPopular ? ' ⭐' : '') + '</td>' +
            '<td style="font-family:monospace; font-size:12px; color:#a78bfa;">' + esc(p.code) + '</td>' +
            '<td style="color:var(--green); font-weight:700;">₦' + Number(p.price).toLocaleString() + '</td>' +
            '<td style="font-size:12px;">' + (p.durationDays || 0) + ' days</td>' +
            '<td>' + (p.isActive ? '<span class="badge badge-green">Active</span>' : '<span class="badge badge-muted">Disabled</span>') + '</td>' +
          '</tr>';
        }).join('') : '<tr><td colspan="5" style="text-align:center; padding:24px; color:var(--muted);">No plans found.</td></tr>') +
        '</tbody>' +
      '</table></div>' +
    '</div>';
}

/* ============================================
   STAFF SECTION
   ✅ Correct endpoint: /  and /invitations
   ✅ Correct permission key: 'staff'
============================================ */
async function loadStaffSection(container) {
  var [staffRes, invRes] = await Promise.all([
    platformApi('/'),
    platformApi('/invitations?status=pending')
  ]);

  var staff       = staffRes.ok ? (staffRes.data.staff || []) : [];
  var invitations = invRes.ok  ? (invRes.data.invitations || []) : [];

  var myId = _platformStaff ? _platformStaff._id : '';

  container.innerHTML =
    '<div style="display:flex; justify-content:flex-end; margin-bottom:16px;">' +
      '<button class="btn btn-primary" onclick="openInviteModal()">+ Invite Staff</button>' +
    '</div>' +
    '<div class="card" style="margin-bottom:20px;">' +
      '<div class="card-head"><h3>Active Platform Staff</h3>' +
        '<span style="font-size:13px; color:var(--muted);">' + staff.length + ' member' + (staff.length !== 1 ? 's' : '') + '</span>' +
      '</div>' +
      '<div class="table-wrap"><table>' +
        '<thead><tr>' +
          '<th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Joined</th><th>Last Login</th>' +
        '</tr></thead>' +
        '<tbody>' +
        (staff.length ? staff.map(function (s) {
          var isMe = s._id && s._id.toString() === myId;
          return '<tr>' +
            '<td style="font-weight:700; color:#fff;">' + esc(s.name) +
              (isMe ? ' <span style="font-size:10px; color:var(--primary); font-weight:400;">(you)</span>' : '') + '</td>' +
            '<td style="font-size:12px;">' + esc(s.email) + '</td>' +
            '<td><span class="badge badge-purple">' + esc(ROLE_LABELS[s.platformRole] || s.platformRole) + '</span></td>' +
            '<td>' + (s.status === 'active'
              ? '<span class="badge badge-green">Active</span>'
              : '<span class="badge badge-red">Suspended</span>') + '</td>' +
            '<td style="font-size:12px;">' + (s.joinedAt    ? fmtDate(s.joinedAt)    : '—') + '</td>' +
            '<td style="font-size:12px;">' + (s.lastLoginAt ? fmtDate(s.lastLoginAt) : 'Never') + '</td>' +
          '</tr>';
        }).join('') :
        '<tr><td colspan="6" style="text-align:center; padding:32px; color:var(--muted);">' +
          'No platform staff members yet.</td></tr>') +
        '</tbody>' +
      '</table></div>' +
    '</div>' +

    '<div class="card">' +
      '<div class="card-head"><h3>Pending Invitations</h3>' +
        '<button class="btn btn-secondary btn-sm" onclick="refreshSection(\'staff\')">↻ Refresh</button>' +
      '</div>' +
      '<div class="table-wrap"><table>' +
        '<thead><tr>' +
          '<th>Email</th><th>Role</th><th>Invited By</th><th>Expires</th><th>Status</th>' +
        '</tr></thead>' +
        '<tbody>' +
        (invitations.length ? invitations.map(function (inv) {
          var isExpired  = inv.isExpiredNow;
          var expStr     = inv.expiresAt ? new Date(inv.expiresAt).toLocaleDateString('en-NG') : '—';
          var invitedBy  = inv.invitedBy === 'root' ? '👑 Root Admin' : 'Platform Admin';
          return '<tr>' +
            '<td style="font-weight:700; color:#fff;">' + esc(inv.email) + '</td>' +
            '<td><span class="badge badge-purple">' + esc(ROLE_LABELS[inv.platformRole] || inv.platformRole) + '</span></td>' +
            '<td style="font-size:12px;">' + invitedBy + '</td>' +
            '<td style="font-size:12px; color:' + (isExpired ? 'var(--orange)' : 'var(--secondary)') + ';">' + expStr + '</td>' +
            '<td>' + (isExpired
              ? '<span class="badge badge-orange">Expired</span>'
              : '<span class="badge badge-purple">Pending</span>') + '</td>' +
          '</tr>';
        }).join('') :
        '<tr><td colspan="5" style="text-align:center; padding:24px; color:var(--muted);">No pending invitations.</td></tr>') +
        '</tbody>' +
      '</table></div>' +
    '</div>';
}

/* ============================================
   ANALYTICS SECTION
   ✅ Correct endpoint: /data/stats
   ✅ Correct permission key: 'analytics'
============================================ */

  var s = res.data.stats || {};

        '<div><div class="stat-val">' + (s.total || 0) + '</div><div class="stat-lbl">Total Schools</div></div></div>' +
      '<div class="stat-card"><div class="stat-icon" style="background:rgba(67,233,123,0.12);">✅</div>' +

      '<div class="stat-card"><div class="stat-icon" style="background:rgba(108,99,255,0.12);">🔔</div>' +
        '<div><div class="stat-val">' + (s.trial || 0) + '</div><div class="stat-lbl">Trial</div></div></div>' +
      '<div class="stat-card"><div class="stat-icon" style="background:rgba(255,165,0,0.12);">⏳</div>' +
        '<div><div class="stat-val">' + (s.expired || 0) + '</div><div class="stat-lbl">Expired</div></div></div>' +
      '<div class="stat-card"><div class="stat-icon" style="background:rgba(255,101,132,0.12);">⛔</div>' +
        '<div><div class="stat-val">' + (s.suspended || 0) + '</div><div class="stat-lbl">Suspended</div></div></div>' +
    '</div>' +
    '<div class="card">' +
      '<div class="card-head"><h3>Revenue Summary</h3></div>' +
      '<div class="card-body">' +
        '<div style="font-size:36px; font-weight:900; color:var(--green); margin-bottom:6px;">' +
          '₦' + Number(s.totalRevenue || 0).toLocaleString() +

/* ============================================
   ANNOUNCEMENTS SECTION
   ✅ Correct permission key: 'announcements'
============================================ */
function loadAnnouncementsSection(container) {
  container.innerHTML =
    '<div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; flex-wrap:wrap;">' +
      '<div class="card" style="min-width:280px;">' +
        '<div class="card-head"><h3>Send Announcement</h3></div>' +
        '<div class="card-body">' +
          '<div class="field">' +
            '<label>Type</label>' +
            '<select id="annType" class="sel">' +
              '<option value="info">ℹ️ Information</option>' +
              '<option value="warning">⚠️ Warning</option>' +
              '<option value="success">✅ Good News</option>' +
              '<option value="maintenance">🔧 Maintenance</option>' +
            '</select>' +
          '</div>' +
          '<div class="field">' +
            '<label>Title <span style="color:var(--red);">*</span></label>' +
            '<input type="text" id="annTitle" class="inp" placeholder="e.g. Scheduled Maintenance" />' +
          '</div>' +
          '<div class="field">' +
            '<label>Message <span style="color:var(--red);">*</span></label>' +
            '<textarea id="annMsg" class="tex" rows="4" placeholder="Enter announcement text..."></textarea>' +
          '</div>' +
          '<div id="annErrBox" style="display:none; background:rgba(255,101,132,0.1); border:1px solid rgba(255,101,132,0.3); color:var(--red); padding:10px; border-radius:8px; font-size:13px; margin-bottom:12px;"></div>' +
          '<button class="btn btn-primary" style="width:100%;" onclick="sendAnnouncement()">📢 Send to All Institutions</button>' +
          '<div style="font-size:12px; color:var(--muted); margin-top:10px; line-height:1.6;">' +
            'This announcement will be visible to all institution administrators on their dashboard.' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="card" style="min-width:280px;">' +
        '<div class="card-head"><h3>Notes</h3></div>' +
        '<div class="card-body">' +
          '<div class="empty">' +
            '<div class="empty-icon">📢</div>' +
            '<div class="empty-title">Announcement History</div>' +
            '<div class="empty-sub">Full announcement history is available in the Root Admin Panel.</div>' +
            '<a href="/admin.html" target="_blank" class="btn btn-secondary" style="margin-top:16px;">Open Root Admin Panel →</a>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
}

async function sendAnnouncement() {
  var type  = (document.getElementById('annType')  || {}).value || 'info';
  var title = ((document.getElementById('annTitle') || {}).value || '').trim();
  var msg   = ((document.getElementById('annMsg')   || {}).value || '').trim();
  var errEl = document.getElementById('annErrBox');

  if (!title || !msg) {
    if (errEl) { errEl.textContent = 'Title and message are both required.'; errEl.style.display = 'block'; }
    return;
  }
  if (errEl) errEl.style.display = 'none';

  /* Platform staff send announcements via their own token to the admin endpoint */
  var headers = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + platformGetToken() };
  try {
    var res  = await fetch('/api/admin/institutions/announcements', {
      method: 'POST', headers: headers,
      body: JSON.stringify({ title: title, message: msg, type: type })
    });
    var data = await res.json();
    if (res.ok && data.success) {
      platformToast('Announcement sent to all institutions!', 'success');
      var tEl = document.getElementById('annTitle');
      var mEl = document.getElementById('annMsg');
      if (tEl) tEl.value = '';
      if (mEl) mEl.value = '';
    } else {
      platformToast(data.message || 'Failed to send. Check Root Admin Panel for announcement tools.', 'error');
    }
  } catch (err) {
    platformToast('Network error. Please try again.', 'error');
  }
}

/* ============================================ INVITE MODAL */
function openInviteModal() {
  closeAllModals();
  var errEl  = document.getElementById('inviteErrBox');
  var result = document.getElementById('inviteResultWrap');
  var footer = document.getElementById('inviteModalFooter');
  if (errEl)  errEl.style.display   = 'none';
  if (result) result.style.display  = 'none';
  if (footer) footer.style.display  = 'flex';
  var em = document.getElementById('invEmail'); if (em) em.value = '';
  var nm = document.getElementById('invName');  if (nm) nm.value = '';
  var rl = document.getElementById('invRole');  if (rl) rl.value = 'support_admin';
  _generatedUrl = '';
  updateRoleDescription();
  document.getElementById('inviteModal').style.display = 'flex';
}

function updateRoleDescription() {
  var role = (document.getElementById('invRole') || {}).value || '';
  var hint = document.getElementById('roleHint');
  if (hint) hint.textContent = ROLE_DESCRIPTIONS[role] || '';
}

async function sendInvite() {
  var email = ((document.getElementById('invEmail') || {}).value || '').trim();
  var name  = ((document.getElementById('invName')  || {}).value || '').trim();
  var role  = (document.getElementById('invRole')   || {}).value || '';
  var errEl = document.getElementById('inviteErrBox');
  if (errEl) errEl.style.display = 'none';

  if (!email) {
    if (errEl) { errEl.textContent = 'Email address is required.'; errEl.style.display = 'block'; }
    return;
  }

  var btn = document.getElementById('sendInviteBtn');
  if (btn) { btn.innerHTML = '<span class="spinner"></span> Creating...'; btn.disabled = true; }

  var res = await platformApi('/invite', 'POST', { email: email, name: name, platformRole: role });

  if (btn) { btn.innerHTML = 'Create Invitation'; btn.disabled = false; }

  if (res.ok) {
    _generatedUrl = res.data.invitation.inviteUrl || '';
    var urlEl = document.getElementById('generatedInviteUrl');
    if (urlEl) urlEl.textContent = _generatedUrl;
    var rw = document.getElementById('inviteResultWrap');
    var ft = document.getElementById('inviteModalFooter');
    if (rw) rw.style.display = 'block';
    if (ft) ft.style.display  = 'none';
    platformToast('Invitation created for ' + email + '.', 'success');
    /* Refresh staff section if visible */
    var staffContent = document.getElementById('content-staff');
    if (staffContent) { refreshSection('staff'); }
  } else {
    if (errEl) {
      errEl.textContent = res.data.message || 'Failed to create invitation.';
      errEl.style.display = 'block';
    }
  }
}

function copyInviteUrl() {
  if (!_generatedUrl) { return; }
  navigator.clipboard.writeText(_generatedUrl)
    .then(function () { platformToast('Invitation link copied!', 'success'); })
    .catch(function () { platformToast('Could not copy automatically. Please select and copy the link manually.', 'error'); });
}

/* ============================================ UTILITIES */
function platformLogout() {
  localStorage.removeItem(PLATFORM_TOKEN_KEY);
  localStorage.removeItem(PLATFORM_STAFF_KEY);
  window.location.href = '/admin.html';
}

function closeModal(id) {
  var el = document.getElementById(id);
  if (el) el.style.display = 'none';
}
function closeAllModals() {
  document.querySelectorAll('.modal-overlay').forEach(function (m) { m.style.display = 'none'; });
}
document.addEventListener('click', function (e) {
  if (e.target.classList.contains('modal-overlay')) { closeAllModals(); }
});

function openSidebar()  {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebarOverlay').classList.add('visible');
  document.body.style.overflow = 'hidden';
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('visible');
  document.body.style.overflow = '';
}

function setText(id, val) {
  var el = document.getElementById(id);
  if (el) el.textContent = val;
}

function esc(str) {
  return String(str || '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtDate(d) {
  if (!d) return '—';
  return new Date(d).toLocaleDateString('en-NG', { day:'numeric', month:'short', year:'numeric' });
}

function platformToast(msg, type) {
  type = type || 'info';
  var el = document.getElementById('platformToast');
  if (!el) { return; }
  var color  = type === 'success' ? 'var(--green)' : type === 'error' ? 'var(--red)' : '#a78bfa';
  var border = type === 'success' ? 'rgba(67,233,123,0.4)'
             : type === 'error'   ? 'rgba(255,101,132,0.4)'
             : 'rgba(108,99,255,0.4)';
  var icon   = type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️';
  el.innerHTML = '<span style="font-size:16px;">' + icon + '</span>' +
                 '<span style="color:' + color + ';">' + esc(msg) + '</span>';
  el.style.borderColor = border;
  el.style.display     = 'flex';
  clearTimeout(el._to);
  el._to = setTimeout(function () { el.style.display = 'none'; }, 4500);
}
</script>
